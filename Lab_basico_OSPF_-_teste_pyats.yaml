annotations:
  - border_color: '#00000000'
    border_style: ''
    color: '#808080FF'
    rotation: 0
    text_bold: false
    text_content: |-
      Instruções:
      1) IP dos links entre roteadores: 10.x.y.0/24
      onde: x < y são os números dos roteadores.
      A parte de host é o número do roteador.
      Exemplo: R2 <--> R3 = 10.2.3.2 <--> 10.2.3.3
      2) Uma interface loopback L0 em cada roteador:
      x.x.x.x/24 com x igual ao número do roteador
      Exemplo: L0 de R4 = 4.4.4.4/24
      3) OSPF area 0 rodando em todos roteadores anunciando todas interfaces.
    text_font: monospace
    text_italic: false
    text_size: 12
    text_unit: pt
    thickness: 1
    type: text
    x1: 80.0
    y1: -320.0
    z_index: 0
smart_annotations: []
nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R4
          !
          no ip domain lookup
          !
          username cisco privilege 15 secret cisco123
          enable secret cisco123
          !
          interface Loopback0
           ip address 4.4.4.4 255.255.255.0
          !
          interface Ethernet0/1
           ip address 10.1.4.4 255.255.255.0
           no shutdown
          !
          interface Ethernet0/0
           ip address 10.3.4.4 255.255.255.0
           no shutdown
          !
          interface Ethernet0/2
           no ip address
           shutdown
          !
          interface Ethernet0/3
           no ip address
           shutdown
          !
          router ospf 1
           router-id 4.4.4.4
           network 4.4.4.4 0.0.0.0 area 0
           network 10.1.4.0 0.0.0.255 area 0
           network 10.3.4.0 0.0.0.255 area 0
          !
          line con 0
           login local
           exec-timeout 0 0
          line vty 0 4
           login local
          !
          end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    image_definition: null
    label: R4
    node_definition: iol-xe
    parameters: {}
    priority: null
    pyats:
      username: cisco
      password: cisco123
      enable_password: cisco123
    ram: null
    tags: []
    x: -240
    y: 80
    interfaces:
